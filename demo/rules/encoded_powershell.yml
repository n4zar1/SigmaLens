title: Hidden PowerShell With Encoded Command
id: 0e6f0c6d-6a0a-4d0d-8a34-6f1f3f2b7c55
status: experimental
description: Demo rule. Hidden window plus an encoded command is rarely legitimate.
author: SigmaLens demo
date: 2026-03-02
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\powershell.exe'
        - OriginalFileName: 'PowerShell.EXE'
    selection_hidden:
        CommandLine|contains|windash: ' -w hidden'
    selection_enc:
        CommandLine|contains|windash:
            - ' -enc '
            - ' -EncodedCommand '
    condition: all of selection_*
level: high
